# BlindCrate Config
# Copy to config.yaml for runtime

# App
app:
  app_name: "blindcrate"
  env: "development"
  addr: ":8000"
  session_cookie_name: "blindcrate_session_id" # change this in local dev env
  session_secret: "<uniq string>" # you can't change this after first time start
  session_domain: ".blindcrate.com"
  session_age: 86400
  session_secure: false
  session_http_only: false
  api_prefix: "/api"
  secret_key: "<uniq string>" # encrypts secrets saved in admin settings (e.g. SMTP password), you can't change this after saving them

# DB
database:
  enabled: true
  host: "127.0.0.1"
  port: 5432
  username: "postgres"
  password: ""
  database: "blindcrate"
  ssl_mode: "disable"
  time_zone: "UTC"
  max_idle_conn: 10
  max_open_conn: 100
  conn_max_lifetime: 3600
  log_level: "info"  # silent, error, warn, info
  slow_threshold: 200ms
  ignore_record_not_found_error: false

# Redis
redis:
  enabled: true
  host: "127.0.0.1"
  port: 6379
  username: ""
  password: ""
  db: 0
  pool_size: 100
  min_idle_conn: 10
  dial_timeout: 5
  read_timeout: 3
  write_timeout: 3

# Log
log:
  level: "info"  # debug, info, warn, error, fatal, panic
  format: "json"  # text, json
  output: "stdout"  # stdout, file
  file_path: "./logs/app.log"
  max_size: 100
  max_age: 30
  max_backups: 10
  compress: true

# Schedule
schedule:
  port: 8002 # scheduler probe port
  time_zone: "Asia/Shanghai" # cron expressions are evaluated in this time zone

# Worker
worker:
  port: 8001 # worker probe port
  concurrency: 10 # max tasks processed at the same time

# OpenTelemetry
otel:
  sampling_rate: 0.1
