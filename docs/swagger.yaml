definitions:
  admin.AdjustUserBalanceRequest:
    properties:
      amount:
        description: 正数加款, 负数扣款, 扣款后余额不能为负
        type: integer
      currency:
        maxLength: 32
        type: string
      idempotency_key:
        description: 每次打开调账表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      remark:
        description: 调账原因, 用户可在流水中看到
        type: string
    required:
    - amount
    - currency
    - idempotency_key
    - remark
    type: object
  admin.AdjustUserBalanceResponse:
    properties:
      data:
        $ref: '#/definitions/wallet.Transaction'
      error_msg:
        type: string
    type: object
  admin.AdjustUserInventoryRequest:
    properties:
      idempotency_key:
        description: 每次打开表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      item_id:
        type: integer
      quantity:
        description: 正数发放, 负数扣除, 扣除后数量不能为负
        type: integer
      remark:
        description: 调整原因, 用户可在流水中看到
        type: string
    required:
    - idempotency_key
    - item_id
    - quantity
    - remark
    type: object
  admin.AdjustUserInventoryResponse:
    properties:
      data:
        $ref: '#/definitions/inventory.Transaction'
      error_msg:
        type: string
    type: object
  admin.AuditLogItem:
    properties:
      action:
