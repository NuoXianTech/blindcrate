info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
paths:
  /api/v1/admin/audit-logs:
    get:
      description: 包含用户和管理员的操作
      parameters:
      - in: query
        maxLength: 64
        name: action
        type: string
      - in: query
        name: actor_id
        type: integer
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - enum:
        - user
        - admin
        in: query
        name: scope
        type: string
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: target_id
        type: integer
      - in: query
        maxLength: 32
        name: target_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListAuditLogsResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.Response'
      summary: 获取操作日志列表
      tags:
      - admin
  /api/v1/admin/conditions/types:
    get:
      description: 包含每种条件的参数表单描述, 用于条件编辑器; input 为 currency、item、scope 的字段需要用选择器填写
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListConditionTypesResponseData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.Response'
      summary: 获取全部条件类型
      tags:
      - admin
  /api/v1/admin/inventory/transactions:
    get:
      parameters:
      - in: query
        maxLength: 64
        name: biz_id
        type: string
      - in: query
        maxLength: 32
        name: biz_type
        type: string
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - in: query
        name: item_id
        type: integer
      - in: query
        name: operator_id
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListInventoryTransactionsResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.Response'
      summary: 获取全部用户的背包流水
      tags:
      - admin
  /api/v1/admin/items:
    get:
      description: 包含已下架的物品, 不包含已删除的物品
      parameters:
      - description: 类别代码
        in: query
        maxLength: 32
        name: category
        type: string
      - in: query
        minimum: 1
        name: current
        type: integer
      - in: query
        name: is_enabled
        type: boolean
      - description: 按代码或名称搜索, 不区分大小写
        in: query
        maxLength: 64
        name: keyword
        type: string
      - description: 品质等级
        in: query
        minimum: 1
        name: quality
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListItemsResponseData'
              type: object
        "400":
