definitions:
  auth.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  auth.BanUserResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      email:
        description: 只有验证通过的邮箱才会写入, 未绑定为空
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    type: object
  auth.ChangePasswordResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        description: 用户名或已验证的邮箱
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LogoutResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.SendEmailCodeResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  auth.SetUserDisabledResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.UnbanUserResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.UserInfoResponse:
    properties:
      data:
        $ref: '#/definitions/auth.BasicUserInfo'
      error_msg:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  auth.VerifyEmailResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  health.HealthResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  health.ReadyResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
