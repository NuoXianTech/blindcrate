definitions:
  admin.AdjustUserBalanceRequest:
    properties:
      amount:
        description: 正数加款, 负数扣款, 扣款后余额不能为负
        type: integer
      currency:
        maxLength: 32
        type: string
      idempotency_key:
        description: 每次打开调账表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      remark:
        description: 调账原因, 用户可在流水中看到
        type: string
    required:
    - amount
    - currency
    - idempotency_key
    - remark
    type: object
  admin.AdjustUserInventoryRequest:
    properties:
      idempotency_key:
        description: 每次打开表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      item_id:
        type: integer
      quantity:
        description: 正数发放, 负数扣除, 扣除后数量不能为负
        type: integer
      remark:
        description: 调整原因, 用户可在流水中看到
        type: string
    required:
    - idempotency_key
    - item_id
    - quantity
    - remark
    type: object
  admin.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      actor_username:
        description: 操作人用户名, 未登录或用户已不存在时为空
        type: string
      created_at:
        type: string
      detail:
        type: object
      id:
        type: integer
      ip:
        type: string
      scope:
        type: string
      target_id:
        type: integer
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  admin.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  admin.DeleteItemResponseData:
    properties:
      holder_count:
        description: 删除时持有该物品的用户数
        type: integer
    type: object
  admin.DeleteLootPoolResponseData:
    properties:
      entry_count:
        description: 一同删除的条目数
        type: integer
    type: object
  admin.InventoryTransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  admin.ItemListItem:
    properties:
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      holder_count:
        description: 持有该物品的用户数, 删除前用于提示
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      weight:
        description: 掉落权重, 0 表示不会掉落
        type: integer
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  admin.ItemRequest:
    properties:
      description:
        maxLength: 255
        type: string
      height:
        maximum: 10
        minimum: 1
        type: integer
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放, 已有的保留
        type: boolean
      name:
        maxLength: 64
        type: string
      quality:
        description: '1-7: 灰/绿/蓝/紫/金/红/炫彩'
        maximum: 7
        minimum: 1
        type: integer
      sell_currency:
        maxLength: 32
        type: string
      sell_price:
        description: 0 表示不可卖出
        maximum: 1000000000000
        minimum: 0
        type: integer
      weight:
        description: 掉落权重, 0 表示不会掉落
        maximum: 1000000
        minimum: 0
        type: integer
      width:
        description: 在保险柜中占的格数
        maximum: 10
        minimum: 1
        type: integer
    required:
    - height
    - name
    - quality
    - sell_currency
    - width
    type: object
  admin.ListAuditLogsResponseData:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.AuditLogItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListCurrenciesResponseData:
    properties:
      currencies:
        items:
          $ref: '#/definitions/wallet.Currency'
        type: array
    type: object
  admin.ListInventoryTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.InventoryTransactionItem'
        type: array
    type: object
  admin.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/admin.ItemListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListLootPoolsResponseData:
    properties:
      pools:
        items:
          $ref: '#/definitions/admin.LootPoolListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListMatchesResponseData:
    properties:
      matches:
        items:
          $ref: '#/definitions/match.MatchDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListSettingsResponseData:
    properties:
      groups:
        items:
          $ref: '#/definitions/settings.GroupView'
        type: array
    type: object
  admin.ListUserBalancesResponseData:
    properties:
      balances:
        items:
          $ref: '#/definitions/wallet.BalanceItem'
        type: array
    type: object
  admin.ListUserInventoryResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/auth.User'
        type: array
    type: object
  admin.ListWalletTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.WalletTransactionItem'
        type: array
    type: object
  admin.LootPoolEntriesResponseData:
    properties:
      entries:
        description: 按条目 ID 排序, 包含不参与抽取的条目
        items:
          $ref: '#/definitions/loot.EntryDetail'
        type: array
      pool:
        $ref: '#/definitions/loot.Pool'
    type: object
  admin.LootPoolEntryRequest:
    properties:
      currency:
        description: 掉落的货币
        maxLength: 32
        type: string
      item_id:
        description: 掉落的物品, 与 currency 二选一
        type: integer
      max_quantity:
        maximum: 1000000000000
        minimum: 1
        type: integer
      min_quantity:
        description: 每次掉落的数量范围, 货币为金额, 物品最多 1000000
        maximum: 1000000000000
        minimum: 1
        type: integer
      weight:
        description: 权重
        maximum: 1000000
        minimum: 1
        type: integer
    required:
    - max_quantity
    - min_quantity
    - weight
    type: object
  admin.LootPoolListItem:
    properties:
      code:
        description: 玩法中引用的代码, 如 crate_basic
        type: string
      created_at:
        type: string
      description:
        type: string
      entry_count:
        type: integer
      id:
        type: integer
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  admin.LootPoolRequest:
    properties:
      code:
        description: 玩法中引用的代码, 小写字母、数字和下划线
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        maxLength: 64
        type: string
    required:
    - code
    - name
    type: object
  admin.ReplaceLootPoolEntriesRequest:
    properties:
      entries:
        description: 提交空数组清空条目
        items:
          $ref: '#/definitions/admin.LootPoolEntryRequest'
        maxItems: 200
        type: array
    required:
    - entries
    type: object
  admin.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  admin.TestMailRequest:
    properties:
      to:
        description: 收件人
        type: string
    required:
    - to
    type: object
  admin.UpdateSettingRequest:
    properties:
      clear_secrets:
        description: 需要清空的密钥字段
        items:
          type: string
        maxItems: 32
        type: array
      value:
        description: 设置组的字段, 只需提交改动的字段, 没有提交的保持不变, 密钥字段留空表示不修改
        type: object
    required:
    - value
    type: object
  admin.UpdateUserRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
      username:
        description: 不传表示不修改
        type: string
    type: object
  admin.WalletTransactionItem:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      frozen_after:
        type: integer
      frozen_amount:
        type: integer
      id:
        type: integer
      idempotency_key:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      email:
        description: 只有验证通过的邮箱才会写入, 未绑定为空
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        description: 未设置过密码时可不传
        type: string
    required:
    - new_password
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        description: 用户名或已验证的邮箱
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.UpdateUserInfoRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
    type: object
  auth.User:
    properties:
      avatar_url:
        type: string
      ban_reason:
        type: string
      banned_until:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      is_disabled:
        type: boolean
      last_login_at:
        type: string
      nickname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  health.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListSellOrdersResponseData:
    properties:
      orders:
        items:
          $ref: '#/definitions/inventory.SellOrderDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/inventory.TransactionItem'
        type: array
    type: object
  inventory.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.SellIncome:
    properties:
      amount:
        type: integer
      balance_after:
        description: 入账后的可用余额
        type: integer
      currency:
        type: string
    type: object
  inventory.SellItemsRequest:
    properties:
      idempotency_key:
        description: 每次打开出售确认框生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      items:
        description: 同一物品只能出现一次
        items:
          $ref: '#/definitions/inventory.SellItemsRequestItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - idempotency_key
    - items
    type: object
  inventory.SellItemsRequestItem:
    properties:
      item_id:
        type: integer
      quantity:
        maximum: 1000000
        minimum: 1
        type: integer
      sell_currency:
        description: 背包中看到的卖出货币, 与当前不一致时拒绝出售
        maxLength: 32
        type: string
      sell_price:
        description: 背包中看到的单价, 与当前不一致时拒绝出售
        minimum: 1
        type: integer
    required:
    - item_id
    - quantity
    - sell_currency
    - sell_price
    type: object
  inventory.SellOrderDetail:
    properties:
      created_at:
        type: string
      id:
        type: integer
      incomes:
        description: 按货币代码排序
        items:
          $ref: '#/definitions/inventory.SellIncome'
        type: array
      items:
        description: 按物品 ID 排序
        items:
          $ref: '#/definitions/inventory.SellOrderItem'
        type: array
    type: object
  inventory.SellOrderItem:
    properties:
      amount:
        description: 数量 × 单价
        type: integer
      id:
        type: integer
      item_id:
        type: integer
      item_name:
        description: 出售时的物品名称
        type: string
      order_id:
        type: integer
      quantity:
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 出售时的单价
        type: integer
    type: object
  inventory.Transaction:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        description: 变动时的物品名称
        type: string
      operator_id:
        type: integer
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
    type: object
  inventory.TransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      item_name:
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
    type: object
  inventory.UserItemDetail:
    properties:
      created_at:
        description: 首次获得时间
        type: string
      description:
        type: string
      height:
        type: integer
      image_url:
        type: string
      is_enabled:
        type: boolean
      is_placeholder:
        description: 物品已被删除, 按占位物品展示
        type: boolean
      item_id:
        type: integer
      name:
        type: string
      quality:
        type: integer
      quantity:
        type: integer
      sell_currency:
        type: string
      sell_price:
        type: integer
      updated_at:
        type: string
      width:
        type: integer
    type: object
  item.Item:
    properties:
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      weight:
        description: 掉落权重, 0 表示不会掉落
        type: integer
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  loot.EntryDetail:
    properties:
      created_at:
        type: string
      currency:
        description: 掉落的货币
        type: string
      id:
        type: integer
      image_url:
        description: 物品图片, 货币为空
        type: string
      is_available:
        description: 物品已上架或货币已启用, 否则不参与抽取
        type: boolean
      item_id:
        description: 掉落的物品, 与 Currency 二选一
        type: integer
      max_quantity:
        type: integer
      min_quantity:
        description: 每次掉落的数量在该范围内均匀随机, 货币为金额
        type: integer
      name:
        description: 物品或货币的名称, 已删除的物品为占位名称
        type: string
      pool_id:
        type: integer
      probability:
        description: 当前每次抽中的概率, 不参与抽取时为 0
        type: number
      quality:
        description: 物品品质, 货币为 0
        type: integer
      weight:
        description: 抽中的概率为权重 / 池中可抽取条目的权重之和
        type: integer
    type: object
  loot.Pool:
    properties:
      code:
        description: 玩法中引用的代码, 如 crate_basic
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  loot.PoolOdds:
    properties:
      code:
        type: string
      description:
        type: string
      entries:
        description: 只含可抽取的条目
        items:
          $ref: '#/definitions/loot.EntryDetail'
        type: array
      name:
        type: string
    type: object
  loot.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  match.JoinMatchmakingRequest:
    properties:
      mode:
        maxLength: 32
        type: string
    required:
    - mode
    type: object
  match.ListMatchesResponseData:
    properties:
      matches:
        items:
          $ref: '#/definitions/match.MatchView'
        type: array
      total:
        type: integer
    type: object
  match.Match:
    properties:
      created_at:
        type: string
      finished_at:
        description: 结束或取消的时间
        type: string
      id:
        type: integer
      mode:
        description: 玩法代码
        type: string
      phase:
        description: 当前阶段, 由玩法定义; 结束后保留最后一个阶段
        type: string
      phase_ends_at:
        description: 当前阶段的截止时间, 不限时或已结束时为空
        type: string
      round:
        description: 当前轮次, 由玩法定义
        type: integer
      status:
        description: playing、finished 或 cancelled
        type: string
      updated_at:
        type: string
      version:
        description: 每次切换阶段加 1, 用于丢弃过期的超时任务和推送
        type: integer
    type: object
  match.MatchDetail:
    properties:
      created_at:
        type: string
      finished_at:
        description: 结束或取消的时间
        type: string
      id:
        type: integer
      mode:
        description: 玩法代码
        type: string
      phase:
        description: 当前阶段, 由玩法定义; 结束后保留最后一个阶段
        type: string
      phase_ends_at:
        description: 当前阶段的截止时间, 不限时或已结束时为空
        type: string
      players:
        items:
          $ref: '#/definitions/match.PlayerDetail'
        type: array
      round:
        description: 当前轮次, 由玩法定义
        type: integer
      status:
        description: playing、finished 或 cancelled
        type: string
      updated_at:
        type: string
      version:
        description: 每次切换阶段加 1, 用于丢弃过期的超时任务和推送
        type: integer
    type: object
  match.MatchView:
    properties:
      created_at:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      mode:
        type: string
      phase:
        type: string
      phase_ends_at:
        description: 当前阶段的截止时间, 不限时或已结束时为空
        type: string
      players:
        description: 按座位号排序
        items:
          $ref: '#/definitions/match.PlayerView'
        type: array
      round:
        type: integer
      status:
        type: string
      version:
