definitions:
  admin.AdjustUserBalanceRequest:
    properties:
      amount:
        description: 正数加款, 负数扣款, 扣款后余额不能为负
        type: integer
      currency:
        maxLength: 32
        type: string
      idempotency_key:
        description: 每次打开调账表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      remark:
        description: 调账原因, 用户可在流水中看到
        type: string
    required:
    - amount
    - currency
    - idempotency_key
    - remark
    type: object
  admin.AdjustUserInventoryRequest:
    properties:
      idempotency_key:
        description: 每次打开表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      item_id:
        type: integer
      quantity:
        description: 正数发放, 负数扣除, 扣除后数量不能为负
        type: integer
      remark:
        description: 调整原因, 用户可在流水中看到
        type: string
    required:
    - idempotency_key
    - item_id
    - quantity
    - remark
    type: object
  admin.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      actor_username:
        description: 操作人用户名, 未登录或用户已不存在时为空
        type: string
      created_at:
        type: string
      detail:
        type: object
      id:
        type: integer
      ip:
        type: string
      scope:
        type: string
      target_id:
        type: integer
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  admin.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  admin.DeleteItemResponseData:
    properties:
      holder_count:
        description: 删除时持有该物品的用户数
        type: integer
    type: object
  admin.DeleteLootPoolResponseData:
    properties:
      entry_count:
        description: 一同删除的条目数
        type: integer
    type: object
  admin.InventoryTransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  admin.ItemListItem:
    properties:
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      holder_count:
        description: 持有该物品的用户数, 删除前用于提示
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  admin.ItemRequest:
    properties:
      description:
        maxLength: 255
        type: string
      height:
        maximum: 10
        minimum: 1
        type: integer
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放, 已有的保留
        type: boolean
      name:
        maxLength: 64
        type: string
      quality:
        description: '1-7: 灰/绿/蓝/紫/金/红/炫彩'
        maximum: 7
        minimum: 1
        type: integer
      sell_currency:
        maxLength: 32
        type: string
      sell_price:
        description: 0 表示不可卖出
        maximum: 1000000000000
        minimum: 0
        type: integer
      width:
        description: 在保险柜中占的格数
        maximum: 10
        minimum: 1
        type: integer
    required:
    - height
    - name
    - quality
    - sell_currency
    - width
    type: object
  admin.ListAuditLogsResponseData:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.AuditLogItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListConditionTypesResponseData:
    properties:
      types:
        items:
          $ref: '#/definitions/condition.TypeView'
        type: array
    type: object
  admin.ListCurrenciesResponseData:
    properties:
      currencies:
        items:
          $ref: '#/definitions/wallet.Currency'
        type: array
    type: object
  admin.ListInventoryTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.InventoryTransactionItem'
        type: array
    type: object
  admin.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/admin.ItemListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListLootPoolsResponseData:
    properties:
      pools:
        items:
          $ref: '#/definitions/admin.LootPoolListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListMatchesResponseData:
    properties:
      matches:
        items:
          $ref: '#/definitions/match.MatchDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListSettingsResponseData:
    properties:
      groups:
        items:
          $ref: '#/definitions/settings.GroupView'
        type: array
    type: object
  admin.ListUserBalancesResponseData:
    properties:
      balances:
        items:
          $ref: '#/definitions/wallet.BalanceItem'
        type: array
    type: object
  admin.ListUserInventoryResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/auth.User'
        type: array
    type: object
  admin.ListVenuesResponseData:
    properties:
      total:
        type: integer
      venues:
        items:
          $ref: '#/definitions/venue.Venue'
        type: array
    type: object
  admin.ListWalletTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.WalletTransactionItem'
        type: array
    type: object
  admin.LootPoolEntriesResponseData:
    properties:
      entries:
        description: 按条目 ID 排序, 包含不参与抽取的条目
        items:
          $ref: '#/definitions/loot.EntryDetail'
        type: array
      pool:
        $ref: '#/definitions/loot.Pool'
    type: object
  admin.LootPoolEntryRequest:
    properties:
      currency:
        description: 掉落的货币
        maxLength: 32
        type: string
      item_id:
        description: 掉落的物品, 与 currency 二选一
        type: integer
      max_quantity:
        maximum: 1000000000000
        minimum: 1
        type: integer
      min_quantity:
        description: 每次掉落的数量范围, 货币为金额, 物品最多 1000000
        maximum: 1000000000000
        minimum: 1
        type: integer
      weight:
        description: 权重
        maximum: 1000000
        minimum: 1
        type: integer
    required:
    - max_quantity
    - min_quantity
    - weight
    type: object
  admin.LootPoolListItem:
    properties:
      code:
        description: 玩法中引用的代码, 如 crate_basic
        type: string
      created_at:
        type: string
      description:
        type: string
      entry_count:
        type: integer
      id:
        type: integer
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  admin.LootPoolRequest:
    properties:
      code:
        description: 玩法中引用的代码, 小写字母、数字和下划线
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        maxLength: 64
        type: string
    required:
    - code
    - name
    type: object
  admin.ReplaceLootPoolEntriesRequest:
    properties:
      entries:
        description: 提交空数组清空条目
        items:
          $ref: '#/definitions/admin.LootPoolEntryRequest'
        maxItems: 200
        type: array
    required:
    - entries
    type: object
  admin.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  admin.TestMailRequest:
    properties:
      to:
        description: 收件人
        type: string
    required:
    - to
    type: object
  admin.UpdateSettingRequest:
    properties:
      clear_secrets:
        description: 需要清空的密钥字段
        items:
          type: string
        maxItems: 32
        type: array
      value:
        description: 设置组的字段, 只需提交改动的字段, 没有提交的保持不变, 密钥字段留空表示不修改
        type: object
    required:
    - value
    type: object
  admin.UpdateUserRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
      username:
        description: 不传表示不修改
        type: string
    type: object
  admin.VenueRequest:
    properties:
      auction:
        $ref: '#/definitions/venue.AuctionRule'
      bid_currency:
        maxLength: 32
        type: string
      bots:
        $ref: '#/definitions/venue.BotRule'
      code:
        description: 小写字母、数字和下划线, 创建后不能修改
        maxLength: 24
        type: string
      description:
        maxLength: 255
        type: string
      entry_cost:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 数量为正数, 开局时扣除
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        type: boolean
      name:
        maxLength: 64
        type: string
      pve:
        $ref: '#/definitions/venue.PveRule'
      pve_enabled:
        type: boolean
      ranked_enabled:
        type: boolean
      requirements:
        items:
          $ref: '#/definitions/condition.Condition'
        type: array
      sort_order:
        description: 大厅中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
      warehouse:
        $ref: '#/definitions/venue.WarehouseRule'
    required:
    - bid_currency
    - code
    - name
    type: object
  admin.WalletTransactionItem:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      frozen_after:
        type: integer
      frozen_amount:
        type: integer
      id:
        type: integer
      idempotency_key:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  auction.AuctionView:
    properties:
      contenders:
        description: 加轮时可以出价的座位, 为空表示所有人
        items:
          type: integer
        type: array
      match_id:
        type: integer
      mode:
        type: string
      phase:
        type: string
      phase_ends_at:
        type: string
      piece_count:
        type: integer
      result:
        allOf:
        - $ref: '#/definitions/auction.ResultView'
        description: 结算后才有
      revealed:
        description: 已公开品质的藏品, 第 N 轮公开前 N 件
        items:
          $ref: '#/definitions/auction.RevealedPiece'
        type: array
      round:
        type: integer
      self:
        $ref: '#/definitions/auction.SelfView'
      status:
        type: string
      venue:
        $ref: '#/definitions/auction.VenueInfo'
      version:
        description: 与对局的 version 一致, 客户端只采用 version 更大的推送
        type: integer
    type: object
  auction.Feedback:
    properties:
      hint:
        description: 见 constants.go 的 Hint
        type: string
      rank:
        description: 自己的出价在出过价的人中排第几, 并列算同一名, 没出过价为 0
        type: integer
      round:
        type: integer
    type: object
  auction.PieceView:
    properties:
      height:
        type: integer
      image_url:
        type: string
      item_id:
        type: integer
      name:
        type: string
      quality:
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 开局时的回收价
        type: integer
      width:
        type: integer
      x:
        type: integer
      "y":
        type: integer
    type: object
  auction.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auction.ResultView:
    properties:
      outcome:
        description: sold、unsold 或 cancelled
        type: string
      pieces:
        items:
          $ref: '#/definitions/auction.PieceView'
        type: array
      price:
        type: integer
      profit:
        description: 自己的盈亏, 出价货币, 已扣除入场代价; 练习局按正式局计算
        type: integer
      seats:
        description: 按座位号排序
        items:
          $ref: '#/definitions/auction.SeatResult'
        type: array
      value:
        description: 仓库价值
        type: integer
      winner_seat:
        description: 没有成交时为 0
        type: integer
    type: object
  auction.RevealedPiece:
    properties:
      order:
        description: 公开顺序, 从 1 开始
        type: integer
      quality:
        type: integer
    type: object
  auction.SeatResult:
    properties:
      bid:
        description: 最后的出价, 0 表示没出过价
        type: integer
      seat:
        type: integer
    type: object
  auction.SelfView:
    properties:
      bid:
        description: 当前出价, 0 表示还没出过价
        type: integer
      can_bid:
        description: 现在是否可以出价
        type: boolean
      carry:
        description: 带入资金, 出价的上限
        type: integer
      entry_cost:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 实际扣除的入场代价
      feedback:
        description: 每轮结束后的反馈
        items:
          $ref: '#/definitions/auction.Feedback'
        type: array
      is_practice:
        type: boolean
      seat:
        type: integer
      submitted:
        description: 本轮是否已出价
        type: boolean
    type: object
  auction.VenueInfo:
    properties:
      bid_currency:
        type: string
      code:
        type: string
      grid:
        $ref: '#/definitions/venue.Grid'
      max_extra_rounds:
        type: integer
      name:
        type: string
      quick_win:
        description: 前 Rounds-1 轮的速胜倍率, 基点
        items:
          type: integer
        type: array
      rounds:
        type: integer
      start_price:
        type: integer
    type: object
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      email:
        description: 只有验证通过的邮箱才会写入, 未绑定为空
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        description: 未设置过密码时可不传
        type: string
    required:
    - new_password
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        description: 用户名或已验证的邮箱
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.UpdateUserInfoRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
    type: object
  auth.User:
    properties:
      avatar_url:
        type: string
      ban_reason:
        type: string
      banned_until:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      is_disabled:
        type: boolean
      last_login_at:
        type: string
      nickname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  condition.Condition:
    properties:
      params:
        description: 参数, 结构由条件类型决定
        type: object
      type:
        description: 条件类型, 见 constants.go
        type: string
    type: object
  condition.Field:
    properties:
      help:
        type: string
      input:
        description: text / switch / number, 或选择器 currency / item / scope
        type: string
      key:
        type: string
      label:
        type: string
      type:
        description: string / bool / int
        type: string
    type: object
  condition.Progress:
    properties:
      current:
        description: 当前值, 如已玩局数; 没有进度的条件为 0
        type: integer
      met:
        type: boolean
      target:
        description: 目标值; 没有进度的条件为 0
        type: integer
      text:
        description: 展示给玩家的描述, 如 "完成 10 局排位(3/10)"
        type: string
      type:
        type: string
    type: object
  condition.TypeView:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/condition.Field'
        type: array
      label:
        type: string
      type:
        type: string
    type: object
  health.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListSellOrdersResponseData:
    properties:
      orders:
        items:
          $ref: '#/definitions/inventory.SellOrderDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/inventory.TransactionItem'
        type: array
    type: object
  inventory.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.SellIncome:
    properties:
      amount:
        description: 卖出金额, 未扣手续费
        type: integer
      balance_after:
        description: 扣除手续费后的可用余额
        type: integer
      currency:
        type: string
      fee:
        description: 手续费, 按卖出金额乘手续费率向下取整
        type: integer
    type: object
  inventory.SellItemsRequest:
    properties:
      fee_rate:
        description: 出售确认框中看到的手续费率(基点), 传入时与当前不一致则拒绝出售
        maximum: 10000
        minimum: 0
        type: integer
      idempotency_key:
        description: 每次打开出售确认框生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      items:
        description: 同一物品只能出现一次
        items:
          $ref: '#/definitions/inventory.SellItemsRequestItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - idempotency_key
    - items
    type: object
  inventory.SellItemsRequestItem:
    properties:
      item_id:
        type: integer
      quantity:
        maximum: 1000000
        minimum: 1
        type: integer
      sell_currency:
        description: 背包中看到的卖出货币, 与当前不一致时拒绝出售
        maxLength: 32
        type: string
      sell_price:
        description: 背包中看到的单价, 与当前不一致时拒绝出售
        minimum: 1
        type: integer
    required:
    - item_id
    - quantity
    - sell_currency
    - sell_price
    type: object
  inventory.SellOrderDetail:
    properties:
      created_at:
        type: string
      fee_rate:
        description: 出售时的手续费率, 单位为基点
        type: integer
      id:
        type: integer
      incomes:
        description: 按货币代码排序
        items:
          $ref: '#/definitions/inventory.SellIncome'
        type: array
      items:
        description: 按物品 ID 排序
        items:
          $ref: '#/definitions/inventory.SellOrderItem'
        type: array
    type: object
  inventory.SellOrderItem:
    properties:
      amount:
        description: 数量 × 单价
        type: integer
      id:
        type: integer
      item_id:
        type: integer
      item_name:
        description: 出售时的物品名称
        type: string
      order_id:
        type: integer
      quantity:
        type: integer
      sell_currency:
        type: string
      sell_price:
