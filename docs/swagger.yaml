definitions:
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    type: object
  auth.ChangePasswordResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LogoutResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.UserInfoResponse:
    properties:
      data:
        $ref: '#/definitions/auth.BasicUserInfo'
      error_msg:
        type: string
    type: object
  health.HealthResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  health.ReadyResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
