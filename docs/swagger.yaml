definitions:
  admin.AdjustUserBalanceRequest:
    properties:
      amount:
        description: 正数加款, 负数扣款, 扣款后余额不能为负
        type: integer
      currency:
        maxLength: 32
        type: string
      idempotency_key:
        description: 每次打开调账表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      remark:
        description: 调账原因, 用户可在流水中看到
        type: string
    required:
    - amount
    - currency
    - idempotency_key
    - remark
    type: object
  admin.AdjustUserInventoryRequest:
    properties:
      idempotency_key:
        description: 每次打开表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      item_id:
        type: integer
      quantity:
        description: 正数发放, 负数扣除, 扣除后数量不能为负
        type: integer
      remark:
        description: 调整原因, 用户可在流水中看到
        type: string
    required:
    - idempotency_key
    - item_id
    - quantity
    - remark
    type: object
  admin.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      actor_username:
        description: 操作人用户名, 未登录或用户已不存在时为空
        type: string
      created_at:
        type: string
      detail:
        type: object
      id:
        type: integer
      ip:
        type: string
      scope:
        type: string
      target_id:
        type: integer
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  admin.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  admin.CancelMatchRequest:
    properties:
      reason:
        description: 记录在操作日志中
        maxLength: 255
        type: string
    required:
    - reason
    type: object
  admin.CreateCurrencyRequest:
    properties:
      code:
        description: 自然键, 小写字母、数字和下划线
        maxLength: 32
        type: string
      decimals:
        description: 展示用小数位, 已被使用的货币不能修改
        maximum: 6
        minimum: 0
        type: integer
      is_enabled:
        description: 停用后不能再入账或扣款, 基础货币不能停用
        type: boolean
      name:
        maxLength: 32
        type: string
      sort_order:
        description: 余额和下拉框中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
    required:
    - code
    - name
    type: object
  admin.CreateQualityRequest:
    properties:
      code:
        description: 自然键, 小写字母、数字和下划线
        maxLength: 32
        type: string
      color:
        description: '#rrggbb'
        maxLength: 7
        type: string
      effect:
        description: 特效, 空表示纯色, rainbow 为流动渐变
        maxLength: 16
        type: string
      level:
        description: 等级, 越大越稀有
        maximum: 999
        minimum: 1
        type: integer
      name:
        maxLength: 32
        type: string
      scan_ms:
        description: 开箱时扫描这一品质藏品的时长, 毫秒; 品质越高可以扫得越久
        maximum: 10000
        minimum: 100
        type: integer
      sort_order:
        description: 筛选和图例中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
    required:
    - code
    - color
    - level
    - name
    type: object
  admin.CreateSeasonRequest:
    properties:
      code:
        description: 自然键, 小写字母、数字和下划线
        maxLength: 24
        type: string
      ends_at:
        description: RFC3339, 不包含; 需晚于开始时间和当前时间, 赛季结束后不能修改
        type: string
      name:
        maxLength: 64
        type: string
      rating_carry:
        description: 段位分继承上一个赛季的百分比; 赛季开始后不能修改
        maximum: 100
        minimum: 0
        type: integer
      rewards:
        description: 赛季奖励, 分数线不能重复, 每档至少一项; 赛季结束后不能修改
        items:
          $ref: '#/definitions/season.Reward'
        type: array
      starts_at:
        description: RFC3339, 包含; 赛季开始后不能修改
        type: string
    required:
    - code
    - ends_at
    - name
    - starts_at
    type: object
  admin.CurrencyRequest:
    properties:
      decimals:
        description: 展示用小数位, 已被使用的货币不能修改
        maximum: 6
        minimum: 0
        type: integer
      is_enabled:
        description: 停用后不能再入账或扣款, 基础货币不能停用
        type: boolean
      name:
        maxLength: 32
        type: string
      sort_order:
        description: 余额和下拉框中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
    required:
    - name
    type: object
  admin.DeleteItemResponseData:
    properties:
      holder_count:
        description: 删除时持有该物品的用户数
        type: integer
    type: object
  admin.DeleteLootPoolResponseData:
    properties:
      entry_count:
        description: 一同删除的条目数
        type: integer
    type: object
  admin.InventoryTransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  admin.ItemListItem:
    properties:
      category:
        description: 类别代码, 见 RegisterCategory
        type: string
      code:
        description: 英文别名, 可以重复, 物品以 ID 区分
        type: string
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      holder_count:
        description: 持有该物品的用户数, 删除前用于提示
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 品质等级, 见 Quality
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      width:
        description: 在仓库中占的格数
        type: integer
    type: object
  admin.ItemRequest:
    properties:
      category:
        description: 类别代码, 必须已注册
        maxLength: 32
        type: string
      code:
        description: 英文别名, 小写字母、数字和下划线, 可以重复
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      height:
        maximum: 10
        minimum: 1
        type: integer
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放, 已有的保留
        type: boolean
      name:
        maxLength: 64
        type: string
      quality:
        description: 品质等级, 必须存在
        minimum: 1
        type: integer
      sell_currency:
        maxLength: 32
        type: string
      sell_price:
        description: 0 表示不可卖出
        maximum: 1000000000000
        minimum: 0
        type: integer
      width:
        description: 在仓库中占的格数
        maximum: 10
        minimum: 1
        type: integer
    required:
    - category
    - code
    - height
    - name
    - quality
    - sell_currency
    - width
    type: object
  admin.LeaderboardRequest:
    properties:
      code:
        description: 自然键, 小写字母、数字和下划线
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      is_enabled:
        description: 停用后玩家看不到
        type: boolean
      metric:
        description: 排名的指标, 见可以排名的指标
        maxLength: 64
        type: string
      min_matches:
        description: 同一范围和周期内至少完成多少局才上榜
        type: integer
      name:
        maxLength: 64
        type: string
      period:
        description: total 累计、day 当天或 season 当前赛季
        type: string
      scope:
        description: 统计范围, 如 all、mode:ranked、venue:dock
        maxLength: 64
        type: string
      size:
        description: 展示前多少名, 10-500
        type: integer
      sort_order:
        description: 玩家页面的页签从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
    required:
    - code
    - metric
    - name
    - period
    - scope
    type: object
  admin.ListAuditLogsResponseData:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.AuditLogItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListConditionTypesResponseData:
    properties:
      types:
        items:
          $ref: '#/definitions/condition.TypeView'
        type: array
    type: object
  admin.ListCurrenciesResponseData:
    properties:
      currencies:
        items:
          $ref: '#/definitions/wallet.Currency'
        type: array
    type: object
  admin.ListInventoryTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.InventoryTransactionItem'
        type: array
    type: object
  admin.ListItemCategoriesResponseData:
    properties:
      categories:
        items:
          $ref: '#/definitions/item.Category'
        type: array
    type: object
  admin.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/admin.ItemListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListLeaderboardMetricsResponseData:
    properties:
      metrics:
        items:
          $ref: '#/definitions/github_com_NuoXianTech_blindcrate_internal_apps_stats.Metric'
        type: array
    type: object
  admin.ListLeaderboardsResponseData:
    properties:
      boards:
        items:
          $ref: '#/definitions/leaderboard.Board'
        type: array
      total:
        type: integer
    type: object
  admin.ListLootPoolsResponseData:
    properties:
      pools:
        items:
          $ref: '#/definitions/admin.LootPoolListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListMatchesResponseData:
    properties:
      matches:
        items:
          $ref: '#/definitions/match.MatchDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListQualitiesResponseData:
    properties:
      qualities:
        items:
          $ref: '#/definitions/admin.QualityListItem'
        type: array
    type: object
  admin.ListRankedSuspectsResponseData:
    properties:
      suspects:
        items:
          $ref: '#/definitions/auction.Suspect'
        type: array
      total:
        type: integer
    type: object
  admin.ListRankedTiersResponseData:
    properties:
      tiers:
        description: 按分数线从低到高
        items:
          $ref: '#/definitions/ranked.Tier'
        type: array
    type: object
  admin.ListSeasonsResponseData:
    properties:
      seasons:
        items:
          $ref: '#/definitions/season.View'
        type: array
      total:
        type: integer
    type: object
  admin.ListSettingRevisionsResponseData:
    properties:
      revisions:
        items:
          $ref: '#/definitions/admin.SettingRevisionItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListSettingsResponseData:
    properties:
      categories:
        items:
          $ref: '#/definitions/settings.Category'
        type: array
      groups:
        items:
          $ref: '#/definitions/settings.GroupView'
        type: array
    type: object
  admin.ListShopItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/shop.Item'
        type: array
      tabs:
        description: 未删除的商品用到的页签, 按名称排列, 不含空页签
        items:
          type: string
        type: array
      total:
        type: integer
    type: object
  admin.ListShopOrdersResponseData:
    properties:
      orders:
        items:
          $ref: '#/definitions/admin.ShopOrderItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListUserBalancesResponseData:
    properties:
      balances:
        items:
          $ref: '#/definitions/wallet.BalanceItem'
        type: array
    type: object
  admin.ListUserInventoryResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/auth.User'
        type: array
    type: object
  admin.ListVenuesResponseData:
    properties:
      total:
        type: integer
      venues:
        items:
          $ref: '#/definitions/venue.Venue'
        type: array
    type: object
  admin.ListWalletTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.WalletTransactionItem'
        type: array
    type: object
  admin.LootPoolEntriesResponseData:
    properties:
      entries:
        description: 按条目 ID 排序, 包含不参与抽取的条目
        items:
          $ref: '#/definitions/loot.EntryDetail'
        type: array
      pool:
        $ref: '#/definitions/loot.Pool'
    type: object
  admin.LootPoolEntryRequest:
    properties:
      currency:
        description: 掉落的货币
        maxLength: 32
        type: string
      item_id:
        description: 掉落的物品, 与 currency 二选一
        type: integer
      max_quantity:
        maximum: 1000000000000
        minimum: 1
        type: integer
      min_quantity:
        description: 每次掉落的数量范围, 货币为金额, 物品最多 1000000
        maximum: 1000000000000
        minimum: 1
        type: integer
      weight:
        description: 权重
        maximum: 1000000
        minimum: 1
        type: integer
    required:
    - max_quantity
    - min_quantity
    - weight
    type: object
  admin.LootPoolListItem:
    properties:
      code:
        description: 玩法中引用的代码, 如 crate_basic
        type: string
      created_at:
        type: string
      description:
        type: string
      entry_count:
        type: integer
      id:
        type: integer
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  admin.LootPoolRequest:
    properties:
      code:
        description: 玩法中引用的代码, 小写字母、数字和下划线
        maxLength: 64
        type: string
      description:
        maxLength: 255
        type: string
      is_enabled:
        description: 停用后不能再抽取
        type: boolean
      name:
        maxLength: 64
        type: string
    required:
    - code
    - name
    type: object
  admin.QualityListItem:
    properties:
      code:
        description: 自然键, 导入导出时用来对应
        type: string
      color:
        description: '#rrggbb'
        type: string
      created_at:
        type: string
      effect:
        description: 特效, 空表示纯色, 见 constants.go
        type: string
      item_count:
        description: 使用该品质的未删除物品数, 不为 0 时不能删除
        type: integer
      level:
        type: integer
      name:
        type: string
      scan_ms:
        description: 开箱时扫描这一品质藏品的时长, 毫秒
        type: integer
      sort_order:
        description: 筛选和图例中从小到大排列
        type: integer
      updated_at:
        type: string
    type: object
  admin.QualityRequest:
    properties:
      color:
        description: '#rrggbb'
        maxLength: 7
        type: string
      effect:
        description: 特效, 空表示纯色, rainbow 为流动渐变
        maxLength: 16
        type: string
      name:
        maxLength: 32
        type: string
      scan_ms:
        description: 开箱时扫描这一品质藏品的时长, 毫秒; 品质越高可以扫得越久
        maximum: 10000
        minimum: 100
        type: integer
      sort_order:
        description: 筛选和图例中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
    required:
    - color
    - name
    type: object
  admin.RankedTierRequest:
    properties:
      color:
        description: '#rrggbb'
        maxLength: 7
        type: string
      min_rating:
        description: 分数线, 段位分不低于它时属于这个段位, 0-1000000
        type: integer
      name:
        maxLength: 32
        type: string
    required:
    - color
    - name
    type: object
  admin.ReplaceLootPoolEntriesRequest:
    properties:
      entries:
        description: 提交空数组清空条目
        items:
          $ref: '#/definitions/admin.LootPoolEntryRequest'
        maxItems: 200
        type: array
    required:
    - entries
    type: object
  admin.ResetSettingRequest:
    properties:
      version:
        description: 当前版本, 已被别人修改时返回 409
        minimum: 0
        type: integer
    required:
    - version
    type: object
  admin.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.ReviewRankedSuspectRequest:
    properties:
      last_match_id:
        description: 处理到的对局, 即名单中的 last_match_id
        type: integer
      note:
        description: 处理结果, 如已封禁、正常组队
        maxLength: 255
        type: string
      user_a:
        type: integer
      user_b:
        description: 大于 user_a
        type: integer
    required:
    - last_match_id
    - user_a
    - user_b
    type: object
  admin.RollbackSettingRequest:
    properties:
      target:
        description: 回滚到的版本
        minimum: 0
        type: integer
      version:
        description: 当前版本, 已被别人修改时返回 409
        minimum: 0
        type: integer
    required:
    - target
    - version
    type: object
  admin.SeasonRequest:
    properties:
      ends_at:
        description: RFC3339, 不包含; 需晚于开始时间和当前时间, 赛季结束后不能修改
        type: string
      name:
        maxLength: 64
        type: string
      rating_carry:
        description: 段位分继承上一个赛季的百分比; 赛季开始后不能修改
        maximum: 100
        minimum: 0
        type: integer
      rewards:
        description: 赛季奖励, 分数线不能重复, 每档至少一项; 赛季结束后不能修改
        items:
          $ref: '#/definitions/season.Reward'
        type: array
      starts_at:
        description: RFC3339, 包含; 赛季开始后不能修改
        type: string
    required:
    - ends_at
    - name
    - starts_at
    type: object
  admin.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  admin.SettingRevisionItem:
    properties:
      action:
        type: string
      changes:
        additionalProperties: true
        type: object
      created_at:
        type: string
      from_version:
        type: integer
      updated_by:
        type: integer
      updated_by_username:
        description: 系统操作或用户已不存在时为空
        type: string
      version:
        type: integer
    type: object
  admin.ShopItemRequest:
    properties:
      code:
        description: 小写字母、数字和下划线, 创建后不能修改
        maxLength: 32
        type: string
      description:
        maxLength: 255
        type: string
      ends_at:
        description: RFC3339, 不包含, 为空时不限
        type: string
      goods:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 一份商品, 数量为正数, 不能为空
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        type: boolean
      limits:
        $ref: '#/definitions/shop.Limits'
      name:
        maxLength: 64
        type: string
      original_price:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 原价, 只用于展示折扣
      price:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 一份的价格, 数量为正数, 为空时免费
      requirements:
        items:
          $ref: '#/definitions/condition.Condition'
        type: array
      sort_order:
        description: 商城中从小到大排列
        maximum: 1000000
        minimum: -1000000
        type: integer
      starts_at:
        description: RFC3339, 包含, 为空时不限
        type: string
      stock:
        description: 剩余库存, 为空时不限; 修改时直接覆盖
        type: integer
      tab:
        maxLength: 16
        type: string
    required:
    - code
    - name
    type: object
  admin.ShopOrderItem:
    properties:
      created_at:
        type: string
      goods:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 实际得到的全部商品, 数量为正数
      id:
        type: integer
      item_code:
        type: string
      name:
        type: string
      price:
        allOf:
        - $ref: '#/definitions/reward.Bundle'
        description: 实际支付的总价, 数量为正数
      quantity:
        description: 购买的份数
        type: integer
      refunded_at:
        type: string
      refunded_by:
        description: 退款的管理员, 没有退款时为 0
        type: integer
      refunded_username:
        description: 没有退款时为空
        type: string
      shop_item_id:
        type: integer
      status:
        description: paid 或 refunded
        type: string
