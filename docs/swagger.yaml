        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/match.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/match.Response'
      summary: 加入匹配队列
      tags:
      - match
