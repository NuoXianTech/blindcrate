definitions:
  admin.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      actor_username:
        description: 操作人用户名, 未登录或用户已不存在时为空
        type: string
      created_at:
        type: string
      detail:
        type: object
      id:
        type: integer
      ip:
        type: string
      scope:
        type: string
      target_id:
        type: integer
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  admin.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  admin.BanUserResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.ListAuditLogsResponse:
    properties:
      data:
        $ref: '#/definitions/admin.ListAuditLogsResponseData'
      error_msg:
        type: string
    type: object
  admin.ListAuditLogsResponseData:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.AuditLogItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListUsersResponse:
    properties:
      data:
        $ref: '#/definitions/admin.ListUsersResponseData'
      error_msg:
        type: string
    type: object
  admin.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/auth.User'
        type: array
    type: object
  admin.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  admin.SetUserDisabledResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.UnbanUserResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.UpdateUserRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
      username:
        description: 不传表示不修改
        type: string
    type: object
  admin.UpdateUserResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      email:
        description: 只有验证通过的邮箱才会写入, 未绑定为空
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    type: object
  auth.ChangePasswordResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        description: 用户名或已验证的邮箱
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.LogoutResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.SendEmailCodeResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.UpdateUserInfoRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
    type: object
  auth.UpdateUserInfoResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.User:
    properties:
      avatar_url:
        type: string
      ban_reason:
        type: string
      banned_until:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      is_disabled:
        type: boolean
      last_login_at:
        type: string
      nickname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.UserInfoResponse:
    properties:
      data:
        $ref: '#/definitions/auth.BasicUserInfo'
      error_msg:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  auth.VerifyEmailResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  health.HealthResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  health.ReadyResponse:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
paths:
  /api/v1/admin/audit-logs:
    get:
      parameters:
      - in: query
        maxLength: 64
        name: action
        type: string
      - in: query
        name: actor_id
        type: integer
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - enum:
        - user
        - admin
        in: query
        name: scope
        type: string
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: target_id
        type: integer
      - in: query
        maxLength: 32
        name: target_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
      tags:
      - admin
  /api/v1/admin/users:
    get:
      parameters:
      - in: query
        minimum: 1
        name: current
        type: integer
      - in: query
        name: is_admin
        type: boolean
      - in: query
        name: is_banned
        type: boolean
      - in: query
        name: is_disabled
        type: boolean
      - description: 按用户名或邮箱前缀搜索, 不区分大小写
        in: query
        maxLength: 255
        name: keyword
        type: string
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ListUsersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ListUsersResponse'
        "401":
          description: Unauthorized
          schema:
