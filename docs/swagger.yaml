info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
paths:
  /api/v1/admin/audit-logs:
    get:
      parameters:
      - in: query
        maxLength: 64
        name: action
        type: string
      - in: query
        name: actor_id
        type: integer
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - enum:
        - user
        - admin
        in: query
        name: scope
        type: string
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: target_id
        type: integer
      - in: query
        maxLength: 32
        name: target_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.ListAuditLogsResponse'
      tags:
      - admin
  /api/v1/admin/inventory/transactions:
    get:
      parameters:
      - in: query
        maxLength: 64
        name: biz_id
        type: string
      - in: query
        maxLength: 32
        name: biz_type
        type: string
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - in: query
        name: item_id
        type: integer
      - in: query
        name: operator_id
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
