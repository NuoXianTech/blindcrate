    post:
      consumes:
      - application/json
      description: 凑够一局时立即开局, 此时返回的 match_id 不为 0, 并推送 match:updated; 否则排队等待, 玩法允许人机补位时,
        排队人数达到玩法的最少真人数且等到补位时间后用人机补齐。已在同一个队列中时不重复加入。不满足玩法的条件(如余额不足)时返回 403; 开局时不满足条件会被移出队列并推送
        match:matchmaking_rejected
      parameters:
      - description: request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/match.JoinMatchmakingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
