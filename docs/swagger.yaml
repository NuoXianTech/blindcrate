      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      weight:
        description: 掉落权重, 0 表示不会掉落
        type: integer
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  admin.ItemRequest:
    properties:
      description:
        maxLength: 255
        type: string
      height:
        maximum: 10
        minimum: 1
        type: integer
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放, 已有的保留
        type: boolean
      name:
        maxLength: 64
        type: string
      quality:
        description: '1-7: 灰/绿/蓝/紫/金/红/炫彩'
        maximum: 7
        minimum: 1
        type: integer
      sell_currency:
        maxLength: 32
        type: string
      sell_price:
        description: 0 表示不可卖出
        maximum: 1000000000000
        minimum: 0
        type: integer
      weight:
        description: 掉落权重, 0 表示不会掉落
        maximum: 1000000
        minimum: 0
        type: integer
      width:
        description: 在保险柜中占的格数
        maximum: 10
        minimum: 1
        type: integer
    required:
    - height
    - name
    - quality
    - sell_currency
    - width
    type: object
