definitions:
  admin.AdjustUserBalanceRequest:
    properties:
      amount:
        description: 正数加款, 负数扣款, 扣款后余额不能为负
        type: integer
      currency:
        maxLength: 32
        type: string
      idempotency_key:
        description: 每次打开调账表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      remark:
        description: 调账原因, 用户可在流水中看到
        type: string
    required:
    - amount
    - currency
    - idempotency_key
    - remark
    type: object
  admin.AdjustUserInventoryRequest:
    properties:
      idempotency_key:
        description: 每次打开表单生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      item_id:
        type: integer
      quantity:
        description: 正数发放, 负数扣除, 扣除后数量不能为负
        type: integer
      remark:
        description: 调整原因, 用户可在流水中看到
        type: string
    required:
    - idempotency_key
    - item_id
    - quantity
    - remark
    type: object
  admin.AuditLogItem:
    properties:
      action:
        type: string
      actor_id:
        type: integer
      actor_username:
        description: 操作人用户名, 未登录或用户已不存在时为空
        type: string
      created_at:
        type: string
      detail:
        type: object
      id:
        type: integer
      ip:
        type: string
      scope:
        type: string
      target_id:
        type: integer
      target_type:
        type: string
      user_agent:
        type: string
    type: object
  admin.BanUserRequest:
    properties:
      banned_until:
        description: RFC3339, 必须晚于当前时间; 永久封禁请使用停用
        type: string
      reason:
        maxLength: 255
        type: string
    required:
    - banned_until
    type: object
  admin.DeleteItemResponseData:
    properties:
      holder_count:
        description: 删除时持有该物品的用户数
        type: integer
    type: object
  admin.InventoryTransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  admin.ItemListItem:
    properties:
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      holder_count:
        description: 持有该物品的用户数, 删除前用于提示
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      weight:
        description: 掉落权重, 0 表示不会掉落
        type: integer
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  admin.ItemRequest:
    properties:
      description:
        maxLength: 255
        type: string
      height:
        maximum: 10
        minimum: 1
        type: integer
      image_url:
        maxLength: 1024
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放, 已有的保留
        type: boolean
      name:
        maxLength: 64
        type: string
      quality:
        description: '1-7: 灰/绿/蓝/紫/金/红/炫彩'
        maximum: 7
        minimum: 1
        type: integer
      sell_currency:
        maxLength: 32
        type: string
      sell_price:
        description: 0 表示不可卖出
        maximum: 1000000000000
        minimum: 0
        type: integer
      weight:
        description: 掉落权重, 0 表示不会掉落
        maximum: 1000000
        minimum: 0
        type: integer
      width:
        description: 在保险柜中占的格数
        maximum: 10
        minimum: 1
        type: integer
    required:
    - height
    - name
    - quality
    - sell_currency
    - width
    type: object
  admin.ListAuditLogsResponseData:
    properties:
      logs:
        items:
          $ref: '#/definitions/admin.AuditLogItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListCurrenciesResponseData:
    properties:
      currencies:
        items:
          $ref: '#/definitions/wallet.Currency'
        type: array
    type: object
  admin.ListInventoryTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.InventoryTransactionItem'
        type: array
    type: object
  admin.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/admin.ItemListItem'
        type: array
      total:
        type: integer
    type: object
  admin.ListSettingsResponseData:
    properties:
      groups:
        items:
          $ref: '#/definitions/settings.GroupView'
        type: array
    type: object
  admin.ListUserBalancesResponseData:
    properties:
      balances:
        items:
          $ref: '#/definitions/wallet.BalanceItem'
        type: array
    type: object
  admin.ListUserInventoryResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  admin.ListUsersResponseData:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/auth.User'
        type: array
    type: object
  admin.ListWalletTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/admin.WalletTransactionItem'
        type: array
    type: object
  admin.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  admin.SetUserDisabledRequest:
    properties:
      disabled:
        type: boolean
    required:
    - disabled
    type: object
  admin.TestMailRequest:
    properties:
      to:
        description: 收件人
        type: string
    required:
    - to
    type: object
  admin.UpdateSettingRequest:
    properties:
      clear_secrets:
        description: 需要清空的密钥字段
        items:
          type: string
        maxItems: 32
        type: array
      value:
        description: 设置组的字段, 只需提交改动的字段, 没有提交的保持不变, 密钥字段留空表示不修改
        type: object
    required:
    - value
    type: object
  admin.UpdateUserRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
      username:
        description: 不传表示不修改
        type: string
    type: object
  admin.WalletTransactionItem:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      frozen_after:
        type: integer
      frozen_amount:
        type: integer
      id:
        type: integer
      idempotency_key:
        type: string
      operator_id:
        type: integer
      operator_username:
        description: 系统操作或用户已不存在时为空
        type: string
      remark:
        type: string
      user_id:
        type: integer
      username:
        description: 用户已不存在时为空
        type: string
    type: object
  auth.BasicUserInfo:
    properties:
      avatar_url:
        type: string
      email:
        description: 只有验证通过的邮箱才会写入, 未绑定为空
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        description: 未设置过密码时可不传
        type: string
    required:
    - new_password
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        description: 用户名或已验证的邮箱
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.UpdateUserInfoRequest:
    properties:
      avatar_url:
        description: 不传表示不修改, 传空字符串表示清除头像
        type: string
      nickname:
        description: 不传表示不修改
        type: string
    type: object
  auth.User:
    properties:
      avatar_url:
        type: string
      ban_reason:
        type: string
      banned_until:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      is_disabled:
        type: boolean
      last_login_at:
        type: string
      nickname:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  health.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.ListItemsResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/inventory.UserItemDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListSellOrdersResponseData:
    properties:
      orders:
        items:
          $ref: '#/definitions/inventory.SellOrderDetail'
        type: array
      total:
        type: integer
    type: object
  inventory.ListTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/inventory.TransactionItem'
        type: array
    type: object
  inventory.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  inventory.SellIncome:
    properties:
      amount:
        type: integer
      balance_after:
        description: 入账后的可用余额
        type: integer
      currency:
        type: string
    type: object
  inventory.SellItemsRequest:
    properties:
      idempotency_key:
        description: 每次打开出售确认框生成一个, 重复提交只生效一次
        maxLength: 64
        type: string
      items:
        description: 同一物品只能出现一次
        items:
          $ref: '#/definitions/inventory.SellItemsRequestItem'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - idempotency_key
    - items
    type: object
  inventory.SellItemsRequestItem:
    properties:
      item_id:
        type: integer
      quantity:
        maximum: 1000000
        minimum: 1
        type: integer
      sell_currency:
        description: 背包中看到的卖出货币, 与当前不一致时拒绝出售
        maxLength: 32
        type: string
      sell_price:
        description: 背包中看到的单价, 与当前不一致时拒绝出售
        minimum: 1
        type: integer
    required:
    - item_id
    - quantity
    - sell_currency
    - sell_price
    type: object
  inventory.SellOrderDetail:
    properties:
      created_at:
        type: string
      id:
        type: integer
      incomes:
        description: 按货币代码排序
        items:
          $ref: '#/definitions/inventory.SellIncome'
        type: array
      items:
        description: 按物品 ID 排序
        items:
          $ref: '#/definitions/inventory.SellOrderItem'
        type: array
    type: object
  inventory.SellOrderItem:
    properties:
      amount:
        description: 数量 × 单价
        type: integer
      id:
        type: integer
      item_id:
        type: integer
      item_name:
        description: 出售时的物品名称
        type: string
      order_id:
        type: integer
      quantity:
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 出售时的单价
        type: integer
    type: object
  inventory.Transaction:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      idempotency_key:
        type: string
      item_id:
        type: integer
      item_name:
        description: 变动时的物品名称
        type: string
      operator_id:
        type: integer
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
    type: object
  inventory.TransactionItem:
    properties:
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      id:
        type: integer
      item_id:
        type: integer
      item_name:
        type: string
      quantity:
        type: integer
      quantity_after:
        type: integer
      remark:
        type: string
    type: object
  inventory.UserItemDetail:
    properties:
      created_at:
        description: 首次获得时间
        type: string
      description:
        type: string
      height:
        type: integer
      image_url:
        type: string
      is_enabled:
        type: boolean
      is_placeholder:
        description: 物品已被删除, 按占位物品展示
        type: boolean
      item_id:
        type: integer
      name:
        type: string
      quality:
        type: integer
      quantity:
        type: integer
      sell_currency:
        type: string
      sell_price:
        type: integer
      updated_at:
        type: string
      width:
        type: integer
    type: object
  item.Item:
    properties:
      created_at:
        type: string
      description:
        type: string
      height:
        type: integer
      id:
        type: integer
      image_url:
        type: string
      is_enabled:
        description: 下架后不会掉落, 也不能再发放
        type: boolean
      is_placeholder:
        description: 是否为占位物品, 只由 Resolve 生成
        type: boolean
      name:
        type: string
      quality:
        description: 见 constants.go
        type: integer
      sell_currency:
        type: string
      sell_price:
        description: 0 表示不可卖出
        type: integer
      updated_at:
        type: string
      weight:
        description: 掉落权重, 0 表示不会掉落
        type: integer
      width:
        description: 在保险柜中占的格数
        type: integer
    type: object
  settings.Field:
    properties:
      help:
        type: string
      input:
        description: text / textarea / password / switch / number
        type: string
      key:
        type: string
      label:
        type: string
      public:
        type: boolean
      secret:
        type: boolean
      type:
        description: string / bool / int
        type: string
    type: object
  settings.GroupView:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/settings.Field'
        type: array
      key:
        type: string
      label:
        type: string
      secrets_broken:
        description: 无法解密的密钥字段, 需要重新填写或清空才能保存
        items:
          type: string
        type: array
      secrets_set:
        additionalProperties:
          type: boolean
        description: 密钥字段是否已设置
        type: object
      updated_at:
        description: 未保存过为空
        type: string
      updated_by:
        type: integer
      value:
        additionalProperties: true
        description: 密钥字段固定为空字符串
        type: object
    type: object
  settings.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  wallet.BalanceItem:
    properties:
      balance:
        type: integer
      currency:
        type: string
      decimals:
        type: integer
      frozen:
        type: integer
      is_enabled:
        type: boolean
      name:
        type: string
    type: object
  wallet.Currency:
    properties:
      code:
        type: string
      created_at:
        type: string
      decimals:
        description: 展示用小数位, 金额统一按最小单位的整数存储
        type: integer
      is_enabled:
        type: boolean
      name:
        type: string
      sort_order:
        type: integer
      updated_at:
        type: string
    type: object
  wallet.ListBalancesResponseData:
    properties:
      balances:
        items:
          $ref: '#/definitions/wallet.BalanceItem'
        type: array
    type: object
  wallet.ListTransactionsResponseData:
    properties:
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/wallet.TransactionItem'
        type: array
    type: object
  wallet.Response:
    properties:
      data: {}
      error_msg:
        type: string
    type: object
  wallet.Transaction:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      frozen_after:
        type: integer
      frozen_amount:
        type: integer
      id:
        type: integer
      idempotency_key:
        type: string
      operator_id:
        type: integer
      remark:
        type: string
      user_id:
        type: integer
    type: object
  wallet.TransactionItem:
    properties:
      amount:
        type: integer
      balance_after:
        type: integer
      biz_id:
        type: string
      biz_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      frozen_after:
        type: integer
      frozen_amount:
        type: integer
      id:
        type: integer
      remark:
        type: string
    type: object
info:
  contact: {}
  title: BlindCrate
  version: 0.1.0
paths:
  /api/v1/admin/audit-logs:
    get:
      description: 包含用户和管理员的操作
      parameters:
      - in: query
        maxLength: 64
        name: action
        type: string
      - in: query
        name: actor_id
        type: integer
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - enum:
        - user
        - admin
        in: query
        name: scope
        type: string
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: target_id
        type: integer
      - in: query
        maxLength: 32
        name: target_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListAuditLogsResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.Response'
      summary: 获取操作日志列表
      tags:
      - admin
  /api/v1/admin/inventory/transactions:
    get:
      parameters:
      - in: query
        maxLength: 64
        name: biz_id
        type: string
      - in: query
        maxLength: 32
        name: biz_type
        type: string
      - in: query
        minimum: 1
        name: current
        type: integer
      - description: RFC3339, 不包含
        in: query
        name: end_time
        type: string
      - in: query
        name: item_id
        type: integer
      - in: query
        name: operator_id
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      - description: RFC3339, 包含
        in: query
        name: start_time
        type: string
      - in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListInventoryTransactionsResponseData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/admin.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/admin.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/admin.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.Response'
      summary: 获取全部用户的背包流水
      tags:
      - admin
  /api/v1/admin/items:
    get:
      description: 包含已下架的物品, 不包含已删除的物品
      parameters:
      - in: query
        minimum: 1
        name: current
        type: integer
      - in: query
        name: is_enabled
        type: boolean
      - description: 按名称搜索, 不区分大小写
        in: query
        maxLength: 64
        name: keyword
        type: string
      - in: query
        maximum: 7
        minimum: 1
        name: quality
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/admin.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.ListItemsResponseData'
              type: object
        "400":
