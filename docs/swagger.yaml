          schema:
            $ref: '#/definitions/admin.UnbanUserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/admin.UnbanUserResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/admin.UnbanUserResponse'
      tags:
      - admin
    put:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      - description: request body
        in: body
        name: request
        required: true
