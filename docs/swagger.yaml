            $ref: '#/definitions/match.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/match.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/match.Response'
      summary: 离开匹配队列
      tags:
      - match
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/match.Response'
            - properties:
                data:
                  $ref: '#/definitions/match.MatchmakingStatus'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/match.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/match.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/match.Response'
      summary: 获取当前用户的匹配状态
      tags:
      - match
    post:
      consumes:
      - application/json
      description: 凑够一局时立即开局, 此时返回的 match_id 不为 0, 并推送 match:updated; 否则排队等待, 玩法允许人机补位时,
        排队人数达到玩法的最少真人数且等到补位时间后用人机补齐; 同一 IP 或同一设备(cookie bc_device, 没有时写入)的账号不排进同一局,
        最近一起打过的人优先不排进同一局。已在同一个队列中时不重复加入。不满足玩法的条件(如余额不足)时返回 403; 开局时不满足条件会被移出队列并推送
        match:matchmaking_rejected
      parameters:
      - description: request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/match.JoinMatchmakingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/match.Response'
            - properties:
                data:
                  $ref: '#/definitions/match.MatchmakingStatus'
